name: Build and deploy Astro
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: github-pages-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  lfs: true
                  persist-credentials: false
            - name: Checkout LFS objects
              run: git lfs checkout
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm
            - name: Setup Pages
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              id: pages
              uses: actions/configure-pages@v5
            - name: Install dependencies
              run: npm ci
            - name: Check content and types
              run: npm run check
            - name: Run tests
              run: npm test
            - name: Verify CMS authoring and native pagination
              run: npm run test:integration
            - name: Build Astro
              env:
                  BASE_URL: ${{ steps.pages.outputs.base_url || 'https://dkarlovi.github.io' }}
              run: npm run build
            - name: Validate generated site
              env:
                  BASE_URL: ${{ steps.pages.outputs.base_url || 'https://dkarlovi.github.io' }}
              run: npm run check:output
            - name: Upload artifact
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist
    deploy:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
